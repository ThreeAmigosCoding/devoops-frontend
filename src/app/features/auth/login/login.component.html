<div class="login-container">
  <h2 class="form-title">Login</h2>
  <form (ngSubmit)="onSubmit()" #loginForm="ngForm">
    <mat-form-field class="full-width">
      <mat-label>Username or Email</mat-label>
      <input matInput [(ngModel)]="credentials.usernameOrEmail" name="usernameOrEmail" required>
      <mat-error>Username or email is required</mat-error>
    </mat-form-field>

    <mat-form-field class="full-width">
      <mat-label>Password</mat-label>
      <input matInput type="password" [(ngModel)]="credentials.password" name="password" required minlength="8" #passwordInput="ngModel">
      <mat-error>
        @if (passwordInput.errors?.['required']) { Password is required }
        @if (passwordInput.errors?.['minlength']) { Password must be at least 8 characters }
      </mat-error>
    </mat-form-field>

    <button mat-flat-button color="primary" type="submit" class="submit-btn"
            [disabled]="!loginForm.valid">Login</button>

    @if (errorMessage) {
      <div class="form-error">{{ errorMessage }}</div>
    }
  </form>

  <p class="footer-link">
    Don't have an account?
    <a routerLink="/auth/register">Register here</a>
  </p>
</div>
