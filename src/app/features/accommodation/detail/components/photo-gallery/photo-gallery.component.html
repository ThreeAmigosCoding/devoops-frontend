<div class="gallery-container">
  @if (photos.length > 0) {
    <div class="main-image-wrapper">
      <img
        [src]="getPhotoUrl(mainPhoto!)"
        [alt]="mainPhoto!.originalFilename"
        class="main-image"
        (load)="onImageLoad(mainPhoto!.id)"
        (error)="onImageError(mainPhoto!.id)"
      />

      @if (photos.length > 1) {
        <button class="nav-btn nav-prev" (click)="prevPhoto()" aria-label="Previous photo">
          <mat-icon>chevron_left</mat-icon>
        </button>
        <button class="nav-btn nav-next" (click)="nextPhoto()" aria-label="Next photo">
          <mat-icon>chevron_right</mat-icon>
        </button>
        <div class="dots-container">
          @for (photo of photos; track photo.id; let i = $index) {
            <button
              class="dot"
              [class.active]="i === selectedIndex()"
              (click)="selectPhoto(i)"
              [attr.aria-label]="'Go to photo ' + (i + 1)"
            ></button>
          }
        </div>
      }
    </div>
  } @else {
    <div class="no-photos">
      <mat-icon>image</mat-icon>
      <p>No photos available</p>
    </div>
  }
</div>
