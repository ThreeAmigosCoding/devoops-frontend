<mat-toolbar class="topbar">
  <a routerLink="/accommodations" class="logo">DevOops</a>

  <nav class="nav-links">
    @for (item of navItems; track item.path) {
      @if (isVisible(item)) {
        <a [routerLink]="item.path"
           routerLinkActive="active"
           class="nav-link">{{ item.label }}</a>
      }
    }
  </nav>

  <span class="spacer"></span>

  <div class="actions">
    @if (user() === null) {
      <a routerLink="/auth/login" routerLinkActive="active" class="nav-link action-link">Login</a>
      <a routerLink="/auth/register" routerLinkActive="active" class="nav-link action-link">Register</a>
    }

    <button mat-icon-button class="theme-toggle" (click)="onToggleTheme()"
            [attr.aria-label]="isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
      <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>

    @if (user() !== null) {
      <button mat-icon-button (click)="onLogout()" aria-label="Logout">
        <mat-icon>logout</mat-icon>
      </button>
    }
  </div>
</mat-toolbar>
